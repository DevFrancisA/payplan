name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by deploy.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payplan
          POSTGRES_PASSWORD: payplan
          POSTGRES_DB: payplan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payplan"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PAYPLAN_TEST_DATABASE_URL: postgresql+psycopg://payplan:payplan@localhost:5432/payplan_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results
          path: backend/junit.xml
      - name: Build container image
        run: docker build -t payplan-api:ci .

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
